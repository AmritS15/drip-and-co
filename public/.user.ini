; Increase limits so multiple images (e.g. hero slide 2 images, product gallery, variant gallery) can upload.
; Many shared hosts (cPanel, etc.) apply .user.ini in the document root. If uploads still fail, set these in php.ini or contact your host.
; 8M allows 5MB images with headroom; post_max_size for multiple 5MB uploads
upload_max_filesize = 8M
post_max_size = 32M
